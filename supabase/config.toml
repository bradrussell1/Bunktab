# Supabase CLI config for Bunktab. `supabase link --project-ref qywowvkkkxldgxoatdsh`
# then `supabase db push` applies supabase/migrations to the hosted project.
project_id = "bunktab"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["bunktab://", "exp://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Bunktab code is {{ .Code }}"
max_frequency = "60s"

# Local dev / test numbers so no SMS is needed: phone -> fixed code.
[auth.sms.test_otp]
15555550100 = "123456"
15555550101 = "123456"

[auth.rate_limit]
sms_sent = 30
token_refresh = 150
token_verifications = 30

[storage]
enabled = true
file_size_limit = "10MiB"

[realtime]
enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
