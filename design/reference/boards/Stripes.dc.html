class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.start = { you: true, pp: true, mc: true, ja: false, jt: false, br: false };
    this.state = { done: Object.assign({}, this.start) };

  renderVals() {
    const base = [
      { id: 'you', name: 'You', initials: 'YOU' }, { id: 'pp', name: 'Priya Patel', initials: 'PP' },
      { id: 'mc', name: 'Mike Chen', initials: 'MC' }, { id: 'ja', name: 'Jess Alvarez', initials: 'JA' },
      { id: 'jt', name: 'Jordan Tran', initials: 'JT' }, { id: 'br', name: 'Bradley Ross', initials: 'BR' }
    ];
    const done = this.state.done;
    const count = base.filter((p) => done[p.id]).length;
    const settled = count === base.length;
    const sy = (id) => (done[id] ? 1 : 0);
    const colors = ['#1D1A17', '#E2FF2B', '#FF4FA3', '#1D1A17', '#E2FF2B', '#FF4FA3', '#1D1A17', '#E2FF2B'];
    const confetti = [];
    for (let i = 0; i < 16; i++) confetti.push({ k: 'k' + ((i % 8) + 1), bg: colors[i % 8], d: (i < 8 ? 0 : 220) + 'ms' });
    return {
      settled: settled,
      notDone: !settled,
      toGo: base.length - count,
      chipText: settled ? 'All 6 stripes' : count + ' of 6 stripes',
      chipBg: settled ? '#E2FF2B' : '#FFFFFF',
      zClass: settled ? 'zdance' : '',
      zLabel: 'Zebra with ' + count + ' of 6 stripes filled in',
      m0: count < 3 ? 1 : 0,
      m1: count >= 3 && !settled ? 1 : 0,
      m2: settled ? 1 : 0,
      s0: sy('you'), s1: sy('pp'), s2: sy('mc'), s3: sy('ja'), s4: sy('jt'), s5: sy('br'),
      confetti: confetti,
      people: base.map((p, i) => {
        const d = !!done[p.id];
        return {
          name: p.name,
          initials: p.initials,
          done: d,
          notDone: !d,
          aria: p.name + (d ? ', done, stripe ' + (i + 1) : ', still adding'),
          bg: d ? '#1D1A17' : '#FFFFFF',
          fg: d ? '#FFFFFF' : '#1D1A17',
          border: d ? '1.5px solid #1D1A17' : '1.5px solid #E8E2D8',
          avBg: d ? '#FFF3F8' : '#FFFFFF',
          avBorder: d ? 'none' : '1.5px dashed #D3CDC3',
          sub: d ? 'Done · stripe ' + (i + 1) + ' earned' : 'Still adding expenses',
          subColor: d ? '#E2FF2B' : '#8A857D',
          mark: d ? '#FFFFFF' : '#ECE6DC',
          toggle: () => this.setState({ done: Object.assign({}, done, { [p.id]: !done[p.id] }) })
        };
      }),
      payments: [
        { text: 'Mike pays you', amt: '$690.90', rule: '1px solid #F0EBE2' },
        { text: 'Priya pays you', amt: '$680.90', rule: '1px solid #F0EBE2' },
        { text: 'Jess pays you', amt: '$584.50', rule: '1px solid #F0EBE2' },
        { text: 'Jordan pays you', amt: '$236.80', rule: 'none' }
      ],
      allDone: () => this.setState({ done: { you: true, pp: true, mc: true, ja: true, jt: true, br: true } }),
      reset: () => this.setState({ done: Object.assign({}, this.start) })
    };
  }
}
</script>
