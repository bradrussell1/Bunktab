  <div style="padding: 10px 20px 0 20px; display: flex; flex-direction: column; gap: 2px">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em">Exact Split</h1>

  <div style="margin: 12px 16px 0 16px; display: flex; background: rgba(29,26,23,0.06); border-radius: 999px; padding: 4px">

    <svg width="104" height="96" viewBox="30 -8 200 184" aria-hidden="true" style="position: absolute; right: -2px; bottom: -10px"><path d="M141.3 52.2 L152.8 50.0 L168.6 45.0 L170.6 61.4 L187.0 60.9 L184.5 77.1 L200.5 80.5 L194.2 95.6 L209.0 102.5 L199.3 115.7 L212.0 124.9 L200.3 134.3 L213.0 138.4 L202.8 146.0 L215.1 143.8 L208.0 154.2 L208.7 163.1 L201.2 171.1 L195.5 165.7 L190.6 159.4 L187.0 152.3 L184.6 144.5 L183.4 135.8 L183.0 126.4 L182.5 117.9 L180.9 109.7 L178.3 101.7 L174.8 94.0 L170.5 86.7 L165.3 80.1 L159.4 74.3 L152.9 69.4 L145.8 65.5 L137.7 62.6 Z" fill="#1D1A17" stroke="#1D1A17" stroke-width="6" stroke-linejoin="round"></path><path d="M124 140 C114 168 110 196 116 222 L206 222 C192 168 184 150 186 124 L140 110 Z" fill="#FFFBF2" stroke="#1D1A17" stroke-width="3.5" stroke-linejoin="round"></path><path d="M162 152 Q178 146 192 150" stroke="#1D1A17" stroke-width="10" fill="none" stroke-linecap="round"></path><g transform="rotate(-52 82 58)"><ellipse cx="82" cy="40" rx="15" ry="27" fill="#FFFBF2" stroke="#1D1A17" stroke-width="3.5"></ellipse><ellipse cx="82" cy="44" rx="7.5" ry="17" fill="#F5A9B8"></ellipse></g><g transform="rotate(52 158 58)"><ellipse cx="158" cy="40" rx="15" ry="27" fill="#FFFBF2" stroke="#1D1A17" stroke-width="3.5"></ellipse><ellipse cx="158" cy="44" rx="7.5" ry="17" fill="#F5A9B8"></ellipse></g><ellipse cx="120" cy="98" rx="60" ry="54" fill="#1D1A17" stroke="#1D1A17" stroke-width="7.0"></ellipse><ellipse cx="120" cy="140" rx="42" ry="28" fill="#1D1A17" stroke="#1D1A17" stroke-width="7.0"></ellipse><ellipse cx="120" cy="98" rx="60" ry="54" fill="#FFFBF2"></ellipse><ellipse cx="120" cy="140" rx="42" ry="28" fill="#9B9590"></ellipse><ellipse cx="120" cy="134" rx="30" ry="12" fill="#ABA59F" opacity="0.7"></ellipse><path d="M104 136 q-3 6 2 9 M136 136 q3 6 -2 9" stroke="#3C3833" stroke-width="4" fill="none" stroke-linecap="round"></path><ellipse cx="76" cy="118" rx="10" ry="6.5" fill="#F7A8BC"></ellipse><ellipse cx="164" cy="118" rx="10" ry="6.5" fill="#F7A8BC"></ellipse><g style="opacity: {{zw}}; transition: opacity 250ms ease">  <g class="zeye"><ellipse cx="97" cy="96" rx="7" ry="8" fill="#1D1A17"></ellipse><circle cx="100" cy="92" r="2.6" fill="#FFFFFF"></circle><circle cx="95" cy="100" r="1.4" fill="#FFFFFF"></circle></g>  <g class="zeye"><ellipse cx="143" cy="96" rx="7" ry="8" fill="#1D1A17"></ellipse><circle cx="146" cy="92" r="2.6" fill="#FFFFFF"></circle><circle cx="141" cy="100" r="1.4" fill="#FFFFFF"></circle></g>  <path d="M168 66 C168 66 159 79 159 85 A9 9 0 0 0 177 85 C177 79 168 66 168 66 Z" fill="#FFFFFF" stroke="#1D1A17" stroke-width="2.5"></path></g><g style="opacity: {{zh}}; transition: opacity 250ms ease">  <path d="M88 100 q9 -11 18 0 M134 100 q9 -11 18 0" stroke="#1D1A17" stroke-width="5" fill="none" stroke-linecap="round"></path></g><path d="M100 52 C96 40 102 30 112 28 C110 36 116 40 120 34 C120 26 128 20 138 22 C132 30 136 38 144 38 C140 50 124 58 100 52 Z" fill="#1D1A17" stroke="#1D1A17" stroke-width="3" stroke-linejoin="round"></path></svg>
    <span style="font-size: 14px; color: {{heroLabelColor}}; font-weight: 700">{{heroLabel}}</span>
    <div style="margin-top: 4px; font-size: 44px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: {{heroColor}}">{{heroAmt}}</div>
    <span style="display: inline-block; margin-top: 8px; font-size: 12px; color: #6E6A63">of $184.68 total</span>
  </div>

  <div style="margin: 12px 16px 0 16px; background: #FFFFFF; border-radius: 24px; padding: 4px 12px; box-shadow: 0 1px 2px rgba(29,26,23,0.04), 0 8px 24px rgba(29,26,23,0.05); display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: {{r.rule}}">
        <span style="width: 36px; height: 36px; border-radius: 18px; background: #1D1A17; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{r.ini}}</span>
        <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
          <span style="font-size: 15px; font-weight: 700">{{r.name}}</span>
          <span style="font-size: 12px; color: #6E6A63">{{r.pct}}</span>
        </span>
        <button class="press" onClick="{{r.minus}}" aria-label="{{r.minusLabel}}" style="width: 32px; height: 32px; border-radius: 16px; border: 1.5px solid #E8E2D8; background: #FFFFFF; font-size: 18px; font-weight: 700; line-height: 1; cursor: pointer; color: #1D1A17">−</button>
        <span style="min-width: 76px; height: 36px; border-radius: 999px; background: {{r.amtBg}}; border: 1.5px solid {{r.amtBorder}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">{{r.amt}}</span>
        <button class="press" onClick="{{r.plus}}" aria-label="{{r.plusLabel}}" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: #1D1A17; color: #FFFFFF; font-size: 18px; font-weight: 700; line-height: 1; cursor: pointer">+</button>
      </div>
    </sc-for>
  </div>

  <div style="margin: 10px 16px 0 16px; display: flex; gap: 8px">
    <button class="press" onClick="{{splitRest}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #FFFFFF; box-shadow: 0 1px 2px rgba(29,26,23,0.06); font-size: 13px; font-weight: 700; color: #1D1A17; cursor: pointer">Split what's left evenly</button>
    <button class="press" onClick="{{reset}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #FFFFFF; box-shadow: 0 1px 2px rgba(29,26,23,0.06); font-size: 13px; font-weight: 700; color: #1D1A17; cursor: pointer">Start over</button>
  </div>
  <span style="margin: 8px 20px 0 20px; font-size: 12px; color: #6E6A63">Tap to type, or adjust in $1 increments. Any leftover cent goes to you.</span>

  <div class="dock" style="margin-top: auto; padding: 16px 16px 30px 16px">
    <sc-if value="{{ok}}" hint-placeholder-val="{{ false }}">
      <button class="press rise" style="width: 100%; height: 58px; border-radius: 999px; border: none; background: #E2FF2B; color: #1D1A17; box-shadow: 0 8px 20px rgba(140,160,0,0.25); font-size: 17px; font-weight: 800; cursor: pointer">{{cta}}</button>
    </sc-if>
    <sc-if value="{{notOk}}" hint-placeholder-val="{{ true }}">
      <div class="locked" aria-disabled="true" style="width: 100%; height: 58px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums">{{cta}}</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

  constructor(props) {
    super(props);
    this.start = { you: 6000, pp: 5000, mc: 5000, jt: 0 };
    this.state = { amt: Object.assign({}, this.start) };
  }
  renderVals() {

    const TOTAL_SUB = 14400, TAX = 1188;
    const money = (c) => (c < 0 ? '−' : '') + '$' + (Math.abs(c) / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    // Split an integer number of cents by weight. Everyone is rounded down; any leftover cents go to the
    // account holder (You, always listed first), so the parts add up exactly.
    function allocate(total, weights) {
      const sum = weights.reduce((a, b) => a + b, 0);
      if (sum <= 0) return weights.map(() => 0);
      const out = weights.map((w) => Math.floor((total * w) / sum + 1e-9));
      const holder = weights.findIndex((w) => w > 0); // You if you're in the split, else the first person who is
      out[holder] += total - out.reduce((a, b) => a + b, 0);
      return out;
    }
    
    const GRAND = 18468;
    const people = [{ id: 'you', name: 'You', ini: 'YOU' }, { id: 'pp', name: 'Priya', ini: 'PP' }, { id: 'mc', name: 'Mike', ini: 'MC' }, { id: 'jt', name: 'Jordan', ini: 'JT' }];
    const amt = this.state.amt;
    const assigned = people.reduce((a, p) => a + amt[p.id], 0);
    const left = GRAND - assigned;
    const ok = left === 0;
    const set = (id, v) => this.setState({ amt: Object.assign({}, amt, { [id]: Math.max(0, v) }) });
    return {
      zw: ok ? 0 : 1, zh: ok ? 1 : 0,
      heroBg: ok ? 'rgba(255,255,255,0.88)' : (left > 0 ? '#FFE4F1' : '#FFE4F1'),
      heroLabel: ok ? 'Adds up' : (left > 0 ? 'Remaining' : 'Over by'),
      heroLabelColor: ok ? '#6E6A63' : '#A3195F',
      heroAmt: ok ? money(GRAND) : money(Math.abs(left)),
      heroColor: ok ? '#1D1A17' : '#A3195F',
      rows: people.map((p, i) => ({
        ini: p.ini, name: p.name, amt: money(amt[p.id]),
        pct: amt[p.id] ? (amt[p.id] / GRAND * 100).toFixed(1) + '% of the bill' : 'Nothing yet',
        amtBg: amt[p.id] ? '#FFFFFF' : '#FAF7F2',
        amtBorder: amt[p.id] ? '#1D1A17' : '#E8E2D8',
        rule: i === 0 ? 'none' : '1px solid #F0EBE2',
        minusLabel: 'Take $1 off ' + p.name, plusLabel: 'Add $1 to ' + p.name,
        minus: () => set(p.id, amt[p.id] - 100),
        plus: () => set(p.id, amt[p.id] + 100)
      })),
      splitRest: () => {
        if (left <= 0) return;
        const add = allocate(left, people.map(() => 1));
        const next = Object.assign({}, amt);
        people.forEach((p, i) => { next[p.id] += add[i]; });
        this.setState({ amt: next });
      },
      reset: () => this.setState({ amt: Object.assign({}, this.start) }),
      ok: ok, notOk: !ok,
      cta: ok ? 'Add Expense · ' + money(GRAND) : (left > 0 ? money(left) + ' remaining' : money(-left) + ' over')
    };
  }
}
</script>
