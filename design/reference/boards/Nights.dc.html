<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zebrasplit, Who slept where</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..900&amp;display=swap">
<style>
body{margin:0}
a{color:#171512}a:hover{color:#3A3631}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45}}
.moon{animation:twinkle 2.6s ease-in-out infinite}
@keyframes zz{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-6px);opacity:.5}}
.zz{animation:zz 2.4s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 55% at 100% 0%, #FFE9F3 0%, rgba(255,233,243,0) 60%), radial-gradient(100% 45% at 0% 22%, #F6FFD3 0%, rgba(246,255,211,0) 55%), linear-gradient(180deg, #FFFFFF 0%, #FBF8F2 50%, #F5F0E7 100%); color: #171512; font-family: 'Figtree', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 16px 0 16px; display: flex; align-items: center; justify-content: space-between">
    <a href="Trip.dc.html" aria-label="Back to the dazzle" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(23,21,18,0.06), 0 6px 16px rgba(23,21,18,0.06); display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171512" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 13px; font-weight: 700; background: #FFFFFF; border-radius: 999px; padding: 7px 12px; box-shadow: 0 1px 2px rgba(23,21,18,0.05)">Casa Azul villa · $3,000</span>
  </div>

  <div style="padding: 12px 20px 0 20px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 8px">
      <h1 style="margin: 0; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; white-space: nowrap">Who slept where?</h1>
      <svg width="62" height="57" viewBox="30 -8 200 184" aria-hidden="true" style="flex-shrink: 0; margin-bottom: -6px"><path d="M141.3 52.2 L152.8 50.0 L168.6 45.0 L170.6 61.4 L187.0 60.9 L184.5 77.1 L200.5 80.5 L194.2 95.6 L209.0 102.5 L199.3 115.7 L212.0 124.9 L200.3 134.3 L213.0 138.4 L202.8 146.0 L215.1 143.8 L208.0 154.2 L208.7 163.1 L201.2 171.1 L195.5 165.7 L190.6 159.4 L187.0 152.3 L184.6 144.5 L183.4 135.8 L183.0 126.4 L182.5 117.9 L180.9 109.7 L178.3 101.7 L174.8 94.0 L170.5 86.7 L165.3 80.1 L159.4 74.3 L152.9 69.4 L145.8 65.5 L137.7 62.6 Z" fill="#1D1A17" stroke="#1D1A17" stroke-width="6" stroke-linejoin="round"></path><path d="M124 140 C114 168 110 196 116 222 L206 222 C192 168 184 150 186 124 L140 110 Z" fill="#FFFBF2" stroke="#1D1A17" stroke-width="4" stroke-linejoin="round"></path><path d="M162 152 Q178 146 192 150" stroke="#1D1A17" stroke-width="10" fill="none" stroke-linecap="round"></path><g transform="rotate(-52 82 58)"><ellipse cx="82" cy="40" rx="15" ry="27" fill="#FFFBF2" stroke="#1D1A17" stroke-width="4"></ellipse><ellipse cx="82" cy="44" rx="7.5" ry="17" fill="#F5A9B8"></ellipse></g><g transform="rotate(52 158 58)"><ellipse cx="158" cy="40" rx="15" ry="27" fill="#FFFBF2" stroke="#1D1A17" stroke-width="4"></ellipse><ellipse cx="158" cy="44" rx="7.5" ry="17" fill="#F5A9B8"></ellipse></g><ellipse cx="120" cy="98" rx="60" ry="54" fill="#1D1A17" stroke="#1D1A17" stroke-width="8"></ellipse><ellipse cx="120" cy="140" rx="42" ry="28" fill="#1D1A17" stroke="#1D1A17" stroke-width="8"></ellipse><ellipse cx="120" cy="98" rx="60" ry="54" fill="#FFFBF2"></ellipse><ellipse cx="120" cy="140" rx="42" ry="28" fill="#9B9590"></ellipse><ellipse cx="120" cy="134" rx="30" ry="12" fill="#ABA59F" opacity="0.7"></ellipse><path d="M104 136 q-3 6 2 9 M136 136 q3 6 -2 9" stroke="#3C3833" stroke-width="4" fill="none" stroke-linecap="round"></path><ellipse cx="76" cy="118" rx="10" ry="6.5" fill="#F7A8BC"></ellipse><ellipse cx="164" cy="118" rx="10" ry="6.5" fill="#F7A8BC"></ellipse><g style="opacity: {{zs}}; transition: opacity 250ms ease">  <path d="M88 98 q9 8 18 0 M134 98 q9 8 18 0" stroke="#1D1A17" stroke-width="5.5" fill="none" stroke-linecap="round"></path>  <g class="zz" fill="#1D1A17" font-family="Figtree, sans-serif" font-weight="900"><text x="150" y="20" font-size="24">z</text><text x="170" y="4" font-size="17">z</text></g></g><g style="opacity: {{zw}}; transition: opacity 250ms ease">  <ellipse cx="97" cy="96" rx="7" ry="8" fill="#1D1A17"></ellipse><circle cx="100" cy="92" r="2.6" fill="#FFFFFF"></circle><circle cx="95" cy="100" r="1.4" fill="#FFFFFF"></circle>  <ellipse cx="143" cy="96" rx="7" ry="8" fill="#1D1A17"></ellipse><circle cx="146" cy="92" r="2.6" fill="#FFFFFF"></circle><circle cx="141" cy="100" r="1.4" fill="#FFFFFF"></circle>  <path d="M168 66 C168 66 159 79 159 85 A9 9 0 0 0 177 85 C177 79 168 66 168 66 Z" fill="#FFFFFF" stroke="#1D1A17" stroke-width="2.5"></path></g><path d="M100 52 C96 40 102 30 112 28 C110 36 116 40 120 34 C120 26 128 20 138 22 C132 30 136 38 144 38 C140 50 124 58 100 52 Z" fill="#1D1A17" stroke="#1D1A17" stroke-width="3" stroke-linejoin="round"></path></svg>
    </div>
    <span style="font-size: 15px; color: #6E6A63; line-height: 1.4">Every night you stayed is a stripe. Tap to add one, tap again to take it back.</span>
  </div>

  <div style="margin: 14px 16px 0 16px; display: flex; gap: 8px">
    <button onClick="{{everyone}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #FFFFFF; box-shadow: 0 1px 2px rgba(23,21,18,0.06); font-family: inherit; font-size: 13px; font-weight: 700; color: #171512; cursor: pointer">Everyone, every night</button>
    <button onClick="{{reset}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #FFFFFF; box-shadow: 0 1px 2px rgba(23,21,18,0.06); font-family: inherit; font-size: 13px; font-weight: 700; color: #171512; cursor: pointer">Late arrivals</button>
  </div>

  <div style="margin: 12px 16px 0 16px; background: rgba(255,255,255,0.9); border-radius: 28px; padding: 14px 12px 10px 12px; box-shadow: 0 1px 2px rgba(23,21,18,0.04), 0 12px 30px rgba(23,21,18,0.06); display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: flex-end; gap: 6px; padding-bottom: 4px">
      <span style="width: 60px; flex-shrink: 0"></span>
      <sc-for list="{{nightHeads}}" as="n" hint-placeholder-count="5">
        <span style="width: 34px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px">
          <svg class="moon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="#171512"></path></svg>
          <span style="font-size: 11px; font-weight: 800">{{n.day}}</span>
          <span style="font-size: 11px; color: #6E6A63">{{n.date}}</span>
          <span style="font-size: 11px; font-weight: 800; background: #E2FF2B; border-radius: 999px; padding: 1px 6px">{{n.cost}}</span>
        </span>
      </sc-for>
      <span style="flex-grow: 1"></span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 6px; padding: 3px 0; border-top: 1px solid #F1ECE3">
        <span style="width: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 6px">
          <span style="width: 26px; height: 26px; border-radius: 13px; background: #F3EFE8; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{r.initials}}</span>
          <span style="font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden">{{r.short}}</span>
        </span>
        <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="5">
          <button onClick="{{c.toggle}}" aria-label="{{c.label}}" aria-pressed="{{c.on}}" style="width: 34px; height: 56px; flex-shrink: 0; padding: 0; border: none; border-radius: 14px; background: {{c.cellBg}}; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 200ms ease">
            <svg width="24" height="44" viewBox="0 0 30 50" aria-hidden="true" style="transform: rotate(7deg)">
              <rect x="7" y="2" width="16" height="46" rx="8" fill="none" stroke="#D3CDC3" stroke-width="1.5" stroke-dasharray="3 3"></rect>
              <rect x="7" y="2" width="16" height="46" rx="8" fill="#1D1A17" style="transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY({{c.sy}}); transition: transform 460ms cubic-bezier(.3,1.5,.5,1)"></rect>
            </svg>
          </button>
        </sc-for>
        <span style="flex-grow: 1; text-align: right; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums">{{r.share}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin: 12px 16px 0 16px; display: flex; justify-content: space-between; align-items: center; background: {{checkBg}}; color: {{checkFg}}; border-radius: 20px; padding: 12px 16px; transition: background 250ms ease">
    <span style="font-size: 13px; font-weight: 600">{{nightsLine}}</span>
    <span style="font-size: 14px; font-weight: 800">{{checkLine}}</span>
  </div>

  <div style="margin-top: auto; padding: 0 16px 30px 16px">
    <button style="width: 100%; height: 58px; border-radius: 999px; border: none; background: #E2FF2B; color: #171512; box-shadow: 0 8px 20px rgba(140,160,0,0.25); font-family: inherit; font-size: 17px; font-weight: 800; cursor: pointer">Save the stripes</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.late = {
      You: [1, 1, 1, 1, 1], Priya: [1, 1, 1, 1, 1], Mike: [1, 1, 1, 1, 1],
      Jess: [1, 1, 1, 1, 1], Jordan: [0, 0, 1, 1, 1], Bradley: [0, 0, 0, 1, 1]
    };
    this.state = { stays: JSON.parse(JSON.stringify(this.late)) };
  }
  renderVals() {
    const total = 3000;
    const nights = [
      { day: 'FRI', date: '9' }, { day: 'SAT', date: '10' }, { day: 'SUN', date: '11' },
      { day: 'MON', date: '12' }, { day: 'TUE', date: '13' }
    ];
    const perNight = total / nights.length;
    const people = [
      { name: 'You', initials: 'YOU' }, { name: 'Priya', initials: 'PP' }, { name: 'Mike', initials: 'MC' },
      { name: 'Jess', initials: 'JA' }, { name: 'Jordan', initials: 'JT' }, { name: 'Bradley', initials: 'BR' }
    ];
    const stays = this.state.stays;
    const counts = nights.map((n, i) => people.filter((p) => stays[p.name][i]).length);
    const money = (v) => '$' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    let assigned = 0;
    const rows = people.map((p) => {
      let share = 0;
      const cells = nights.map((n, i) => {
        const on = !!stays[p.name][i];
        if (on && counts[i]) share += perNight / counts[i];
        return {
          on: on,
          sy: on ? 1 : 0,
          cellBg: on ? '#FAF7F2' : 'transparent',
          label: p.name + ', ' + n.day + ' Oct ' + n.date + (on ? ', stayed' : ', not there'),
          toggle: () => {
            const next = JSON.parse(JSON.stringify(stays));
            next[p.name][i] = on ? 0 : 1;
            this.setState({ stays: next });
          }
        };
      });
      assigned += share;
      const n = stays[p.name].reduce((a, b) => a + b, 0);
      return { initials: p.initials, short: p.name, cells: cells, share: n ? money(share) : '—' };
    });
    const stripes = counts.reduce((a, b) => a + b, 0);
    const balanced = Math.abs(assigned - total) < 0.01;
    return {
      nightHeads: nights.map((n, i) => ({ day: n.day, date: n.date, cost: counts[i] ? '$' + Math.round(perNight / counts[i]) : '—' })),
      rows: rows,
      nightsLine: stripes + ' stripes over 5 nights',
      checkLine: balanced ? money(assigned) + ' adds up' : money(total - assigned) + ' unclaimed',
      checkBg: balanced ? '#FFFFFF' : '#FFE4F1',
      checkFg: balanced ? '#171512' : '#A3195F',
      zs: balanced ? 1 : 0,
      zw: balanced ? 0 : 1,
      everyone: () => this.setState({ stays: { You: [1,1,1,1,1], Priya: [1,1,1,1,1], Mike: [1,1,1,1,1], Jess: [1,1,1,1,1], Jordan: [1,1,1,1,1], Bradley: [1,1,1,1,1] } }),
      reset: () => this.setState({ stays: JSON.parse(JSON.stringify(this.late)) })
    };
  }
}
</script>
</body>
</html>
