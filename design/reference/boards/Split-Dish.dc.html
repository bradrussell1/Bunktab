<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

  constructor(props) {
    super(props);
    this.people = [{ id: 'you', name: 'You', ini: 'YOU' }, { id: 'pp', name: 'Priya', ini: 'PP' }, { id: 'mc', name: 'Mike', ini: 'MC' }, { id: 'jt', name: 'Jordan', ini: 'JT' }];
    this.items = [
      { id: 'guac', name: 'Guacamole & chips', price: 1400, qty: 1 },
      { id: 'cev', name: 'Ceviche tostadas', price: 1800, qty: 1 },
      { id: 'fish', name: 'Fish tacos', price: 1600, qty: 1 },
      { id: 'carne', name: 'Carne asada plate', price: 2400, qty: 1 },
      { id: 'shrimp', name: 'Shrimp enchiladas', price: 2100, qty: 1 },
      { id: 'marg', name: 'Margarita', price: 2400, qty: 2 },
      { id: 'pac', name: 'Pacifico', price: 1800, qty: 3 },
      { id: 'churro', name: 'Churros', price: 900, qty: 1 }
    ];
    // Jordan only had the guac and one beer; everything else is still unclaimed.
    this.start = { guac: { jt: 1 }, cev: {}, fish: {}, carne: {}, shrimp: {}, marg: {}, pac: { jt: 1 }, churro: {} };
    this.state = { claims: JSON.parse(JSON.stringify(this.start)), active: 'jt', sheet: false, sel: null };
  }
  renderVals() {

    const TOTAL_SUB = 14400, TAX = 1188;
    const money = (c) => (c < 0 ? '−' : '') + '$' + (Math.abs(c) / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    // Split an integer number of cents by weight. Everyone is rounded down; any leftover cents go to the
    // account holder (You, always listed first), so the parts add up exactly.
    function allocate(total, weights) {
      const sum = weights.reduce((a, b) => a + b, 0);
      if (sum <= 0) return weights.map(() => 0);
      const out = weights.map((w) => Math.floor((total * w) / sum + 1e-9));
      const holder = weights.findIndex((w) => w > 0); // You if you're in the split, else the first person who is
      out[holder] += total - out.reduce((a, b) => a + b, 0);
      return out;
    }
    
    const TIP = 2880;
    const people = this.people, items = this.items;
    const claims = this.state.claims, active = this.state.active;
    const n = people.length;
    const nameOf = {}; people.forEach((p) => { nameOf[p.id] = p.name; });
    const iniOf = {}; people.forEach((p) => { iniOf[p.id] = p.ini; });
    const eps = 1e-6;

    // Cost of each item per person, and what's still unclaimed. Floats here, exact cents at the end.
    const food = {}; people.forEach((p) => { food[p.id] = 0; });
    let unclaimed = 0;
    const info = items.map((it) => {
      const c = claims[it.id] || {};
      const ids = Object.keys(c).filter((k) => c[k] > eps);
      let left = 0;
      if (it.qty === 1) {
        if (!ids.length) left = it.price;
        ids.forEach((id) => { food[id] += it.price / ids.length; });
      } else {
        const unit = it.price / it.qty;
        const used = ids.reduce((a, id) => a + c[id], 0);
        left = unit * Math.max(0, it.qty - used);
        ids.forEach((id) => { food[id] += unit * c[id]; });
      }
      unclaimed += left;
      return { it: it, c: c, ids: ids, left: left };
    });
    const leftCents = Math.round(unclaimed);
    const done = leftCents === 0;

    // Tax and tip follow each person's share of the food. Exact to the cent once everything is claimed.
    const weights = people.map((p) => food[p.id]);
    const foodC = done ? allocate(TOTAL_SUB, weights) : weights.map((w) => Math.round(w));
    const taxC = allocate(Math.round(TAX * (TOTAL_SUB - unclaimed) / TOTAL_SUB), weights);
    const tipC = allocate(Math.round(TIP * (TOTAL_SUB - unclaimed) / TOTAL_SUB), weights);

    const setClaims = (id, obj) => {
      const next = Object.assign({}, claims, { [id]: obj });
      this.setState({ claims: next });
    };
    const tapItem = (x) => {
      const it = x.it, c = Object.assign({}, x.c);
      if (active === 'all') {
        const share = it.qty === 1 ? 1 : it.qty / n;
        const allEven = people.every((p) => Math.abs((c[p.id] || 0) - share) < eps);
        const next = {};
        if (!allEven) people.forEach((p) => { next[p.id] = share; });
        setClaims(it.id, next);
        return;
      }
      if (it.qty === 1) {
        if (c[active]) delete c[active]; else c[active] = 1;
      } else {
        const used = Object.keys(c).reduce((a, k) => a + c[k], 0);
        const rem = it.qty - used;
        if (rem >= 1 - eps) c[active] = (c[active] || 0) + 1;
        else if (rem > eps) c[active] = (c[active] || 0) + rem;
        else if (c[active]) delete c[active];
      }
      setClaims(it.id, c);
    };
    const fmtUnits = (u) => Math.abs(u - Math.round(u)) < eps ? String(Math.round(u)) : '';

    const pickers = [{ id: 'all', name: 'Everyone', ini: 'ALL' }].concat(people).map((p) => {
      const on = p.id === active;
      return {
        active: on, name: p.name, ini: p.ini,
        aria: 'Assign dishes to ' + p.name,
        dotBg: on ? '#1D1A17' : '#FFFFFF', dotFg: on ? '#E2FF2B' : '#1D1A17',
        border: on ? 'none' : '1.5px solid #E8E2D8',
        ring: on ? '0 0 0 3px #FFFBF2, 0 0 0 5px #1D1A17' : '0 1px 2px rgba(29,26,23,0.05)',
        weight: on ? '800' : '600', nameColor: on ? '#1D1A17' : '#6E6A63',
        pick: () => this.setState({ active: p.id })
      };
    });

    const itemsOut = info.map((x, i) => {
      const it = x.it, c = x.c, ids = x.ids;
      const mine = active !== 'all' && c[active] > eps;
      let sub, subColor = '#6E6A63';
      if (it.qty === 1) {
        if (!ids.length) { sub = 'Tap to claim'; subColor = '#A3195F'; }
        else if (ids.length === 1) sub = nameOf[ids[0]];
        else if (ids.length === n) sub = 'Everyone · ' + money(Math.round(it.price / n)) + ' each';
        else sub = 'Shared by ' + ids.length + ' · ' + money(Math.round(it.price / ids.length)) + ' each';
      } else {
        const unit = it.price / it.qty;
        const leftU = it.qty - ids.reduce((a, id) => a + c[id], 0);
        sub = it.qty + ' × ' + money(Math.round(unit));
        if (leftU > eps) { const lu = fmtUnits(leftU); sub += ' · ' + (lu ? lu + ' left' : 'some left'); subColor = '#A3195F'; }
        else sub += ' · all claimed';
      }
      const chips = ids.length === n
        ? [{ label: 'ALL', bg: '#1D1A17', fg: '#FFFFFF' }]
        : ids.map((id) => {
            const u = it.qty > 1 ? fmtUnits(c[id]) : '';
            const isAct = id === active;
            return { label: iniOf[id] + (u && u !== '1' ? ' ×' + u : ''), bg: isAct ? '#1D1A17' : '#F3EFE8', fg: isAct ? '#FFFFFF' : '#1D1A17' };
          });
      return {
        name: it.name + (it.qty > 1 ? ' ×' + it.qty : ''),
        sub: sub, subColor: subColor, chips: chips,
        price: money(it.price),
        dot: x.left > 0.5 ? '#FF4FA3' : 'transparent',
        bg: mine ? '#FAF7F2' : 'transparent',
        rule: i === 0 ? 'none' : '1px solid #F0EBE2',
        aria: it.name + ', ' + sub,
        tap: () => tapItem(x)
      };
    });

    const sel = this.state.sel || {};
    const selIds = people.filter((p) => sel[p.id]).map((p) => p.id);
    const restSplit = allocate(leftCents, people.map((p) => (sel[p.id] ? 1 : 0)));
    const restEach = {}; people.forEach((p, i) => { restEach[p.id] = restSplit[i]; });
    const grandAssigned = foodC.reduce((a, b) => a + b, 0) + taxC.reduce((a, b) => a + b, 0) + tipC.reduce((a, b) => a + b, 0);
    const totals = people.map((p, i) => {
      const t = foodC[i] + taxC[i] + tipC[i];
      const on = p.id === active;
      return {
        name: p.name, total: money(t),
        pct: food[p.id] > 0 ? (food[p.id] / TOTAL_SUB * 100).toFixed(1) + '%' : '0%',
        bg: on ? '#1D1A17' : '#FAF7F2', fg: on ? '#E2FF2B' : '#1D1A17',
        nameColor: on ? '#FFFFFF' : '#6E6A63', pctColor: on ? '#D3CDC3' : '#6E6A63'
      };
    });

    return {
      zw: done ? 0 : 1, zh: done ? 1 : 0,
      pickers: pickers, items: itemsOut, totals: totals,
      hasLeft: !done, noneLeft: done,
      sheetOpen: !!this.state.sheet, sheetClosed: !this.state.sheet,
      lineText: done ? 'All claimed · ' + money(grandAssigned) + ' adds up' : money(leftCents) + ' of food unclaimed',
      lineBg: done ? '#FAF7F2' : '#FFE4F1', lineFg: done ? '#1D1A17' : '#A3195F',
      lockedCta: money(leftCents) + ' remaining',
      sheetLine: 'Everything still unclaimed (' + money(leftCents) + ' of food) is shared evenly by the people you pick. Tax and tip follow.',
      restPeople: people.map((p) => {
        const on = !!sel[p.id];
        return {
          on: on, ini: p.ini, name: p.name,
          each: on ? '+' + money(restEach[p.id] || 0) : 'Not sharing',
          bg: on ? '#1D1A17' : '#FFFFFF', fg: on ? '#FFFFFF' : '#6E6A63',
          border: on ? 'none' : '1.5px dashed #D3CDC3',
          toggle: () => this.setState({ sel: Object.assign({}, sel, { [p.id]: !on }) })
        };
      }),
      confirmLabel: selIds.length ? 'Split between ' + selIds.length : 'Pick someone',
      openSheet: () => {
        // Default: everyone who hasn't claimed anything yet (or everyone, if all have).
        const fresh = {};
        people.forEach((p) => { fresh[p.id] = food[p.id] < 0.5; });
        if (!people.some((p) => fresh[p.id])) people.forEach((p) => { fresh[p.id] = true; });
        this.setState({ sheet: true, sel: fresh });
      },
      closeSheet: () => this.setState({ sheet: false }),
      confirmRest: () => {
        if (!selIds.length) return;
        const k = selIds.length;
        const next = JSON.parse(JSON.stringify(claims));
        info.forEach((x) => {
          if (x.left < 0.5) return;
          const it = x.it, c = next[it.id] || {};
          if (it.qty === 1) selIds.forEach((id) => { c[id] = 1; });
          else {
            const used = Object.keys(c).reduce((a, q) => a + c[q], 0);
            const each = (it.qty - used) / k;
            selIds.forEach((id) => { c[id] = (c[id] || 0) + each; });
          }
          next[it.id] = c;
        });
        this.setState({ claims: next, sheet: false });
      },
      reset: () => this.setState({ claims: JSON.parse(JSON.stringify(this.start)), active: 'jt', sheet: false })
    };
  }
}
</script>
