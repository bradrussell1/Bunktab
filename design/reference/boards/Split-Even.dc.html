y="7.5" fill="#F7A8BC"></ellipse><path d="M88 100 q9 -11 18 0 M134 100 q9 -11 18 0" stroke="#1D1A17" stroke-width="5" fill="none" stroke-linecap="round"></path><path d="M100 52 C96 40 102 30 112 28 C110 36 116 40 120 34 C120 26 128 20 138 22 C132 30 136 38 144 38 C140 50 124 58 100 52 Z" fill="#1D1A17" stroke="#1D1A17" stroke-width="3" stroke-linejoin="round"></path></svg>
    <span style="font-size: 14px; color: #6E6A63">{{countLine}}</span>

  <div style="margin: 14px 20px 0 20px; display: flex; justify-content: space-between; align-items: baseline">

  <div style="margin: 8px 16px 0 16px; background: #FFFFFF; border-radius: 24px; padding: 6px 14px; box-shadow: 0 1px 2px rgba(29,26,23,0.04), 0 8px 24px rgba(29,26,23,0.05); display: flex; flex-direction: column">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

  constructor(props) {
    super(props);
    this.state = { inn: { you: true, pp: true, mc: true, jt: true, ja: false, br: false } };
  }
  renderVals() {

    const TOTAL_SUB = 14400, TAX = 1188;
    const money = (c) => (c < 0 ? '−' : '') + '$' + (Math.abs(c) / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    // Split an integer number of cents by weight. Everyone is rounded down; any leftover cents go to the
    // account holder (You, always listed first), so the parts add up exactly.
    function allocate(total, weights) {
      const sum = weights.reduce((a, b) => a + b, 0);
      if (sum <= 0) return weights.map(() => 0);
      const out = weights.map((w) => Math.floor((total * w) / sum + 1e-9));
      const holder = weights.findIndex((w) => w > 0); // You if you're in the split, else the first person who is
      out[holder] += total - out.reduce((a, b) => a + b, 0);
      return out;
    }
    
    const GRAND = 18468;
    const people = [
      { id: 'you', name: 'You', ini: 'YOU' }, { id: 'pp', name: 'Priya Patel', ini: 'PP' },
      { id: 'mc', name: 'Mike Chen', ini: 'MC' }, { id: 'jt', name: 'Jordan Tran', ini: 'JT' },
      { id: 'ja', name: 'Jess Alvarez', ini: 'JA' }, { id: 'br', name: 'Bradley Ross', ini: 'BR' }
    ];
    const inn = this.state.inn;
    const ids = people.filter((p) => inn[p.id]).map((p) => p.id);
    const n = ids.length;
    // Even split; leftover cents go to the payer (You), per the spec.
    const base = n ? Math.floor(GRAND / n) : 0;
    const extra = n ? GRAND - base * n : 0;
    const share = {};
    ids.forEach((id) => { share[id] = base; });
    if (n) { const holder = inn.you ? 'you' : ids[0]; share[holder] += extra; }
    return {
      countLine: n ? 'Each of ' + n + ' pays' : 'Pick who was there',
      each: money(base),
      centsLine: extra ? 'Leftover ' + extra + '¢ goes to you, the account holder' : 'Splits evenly to the cent',
      rows: people.map((p, i) => {
        const on = !!inn[p.id];
        return {
          on: on, ini: p.ini, name: p.name,
          sub: on ? (p.id === 'you' ? 'Paid the bill' : 'Owes you') : 'Not at dinner',
          amt: on ? money(share[p.id]) : '—',
          amtColor: on ? '#1D1A17' : '#A49F96',
          nameColor: on ? '#1D1A17' : '#6E6A63',
          avBg: on ? '#1D1A17' : '#FFFFFF', avFg: on ? '#FFFFFF' : '#6E6A63',
          avBorder: on ? 'none' : '1.5px dashed #D3CDC3',
          rule: i === 0 ? 'none' : '1px solid #F0EBE2',
          toggle: () => this.setState({ inn: Object.assign({}, inn, { [p.id]: !on }) })
        };
      }),
      cta: n ? 'Add Expense · ' + money(GRAND) : 'Pick at least one person'
    };
  }
}
</script>
